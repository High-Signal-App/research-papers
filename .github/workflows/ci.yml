name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: |
          uv sync --frozen
          pnpm --dir web install --frozen-lockfile --ignore-scripts

      - name: Run Pages health behavior tests
        run: node --test tests/web_health.test.mjs

      - name: Run code-health gate
        run: pnpm run check

  # Golden-question regression gate for the Research Answer API.
  # Calls the deployed Pages Function with fixed reference questions and
  # asserts structural quality (answer length, citation count, citations
  # resolve to real index records, intent routing). Runs as its own job so
  # it can be dispatched selectively and cannot be confused with unit tests.
  golden-rag-regression:
    runs-on: ubuntu-latest
    env:
      GOLDEN_RAG_URL: https://papers.highsignal.app/api/rag/query
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The golden module only needs httpx + pytest — skip the heavy package
      # install (ML deps) that the unit-test job pays for.
      - name: Install golden-check dependencies
        run: pip install pytest pytest-asyncio httpx

      # Fail loudly (never skip) when the API is unreachable, returns non-JSON,
      # or rejects the CI bypass token. Requires the GOLDEN_CI_BYPASS_TOKEN
      # repo secret AND a Pages env secret of the same name (the function
      # skips Turnstile only for a matching X-Golden-CI-Token header).
      - name: Probe Research Answer API
        env:
          GOLDEN_CI_BYPASS_TOKEN: ${{ secrets.GOLDEN_CI_BYPASS_TOKEN }}
        run: |
          code=$(curl -s -m 30 -o /tmp/probe.json -w '%{http_code}' -X POST "$GOLDEN_RAG_URL" \
            -H 'content-type: application/json' \
            -H "X-Golden-CI-Token: ${GOLDEN_CI_BYPASS_TOKEN}" \
            -d '{"question":"golden gate reachability probe"}') || code=000
          if [ "$code" != "200" ] || ! python3 -c 'import json; json.load(open("/tmp/probe.json"))' 2>/dev/null; then
            echo "::error title=Golden RAG regression FAILED::Research Answer API at $GOLDEN_RAG_URL is unreachable, non-JSON, or rejected the CI token (HTTP $code). Cited-answer quality was NOT verified."
            head -c 300 /tmp/probe.json || true
            exit 1
          fi

      - name: Golden-question regression (pytest -m golden)
        env:
          GOLDEN_CI_BYPASS_TOKEN: ${{ secrets.GOLDEN_CI_BYPASS_TOKEN }}
        run: python -m pytest -q -m golden tests/test_rag_golden.py
