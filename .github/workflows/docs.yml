name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "STATUS.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "DEPLOY.md"
      - "scripts/check-docs.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "STATUS.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - "DEPLOY.md"
      - "scripts/check-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate docs (links + structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docs
        run: |
          chmod +x scripts/check-docs.sh
          ./scripts/check-docs.sh
